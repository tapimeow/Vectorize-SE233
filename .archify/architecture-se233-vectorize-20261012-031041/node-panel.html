<style>
#node-panel{position:fixed!important;top:0!important;right:0!important;left:auto!important;height:100vh!important;width:min(460px,100vw)!important;max-width:none!important;margin:0!important;z-index:10000;overflow-y:auto;box-sizing:border-box;padding:20px 22px 40px;
  background:#fff;color:#1f2430;border-left:1px solid #8885;box-shadow:-8px 0 24px #0003;font:14.5px/1.6 system-ui,"Segoe UI","Noto Sans Thai",sans-serif;
  display:none}
#node-panel.open{display:block}
@media (prefers-color-scheme:dark){#node-panel{background:#141824;color:#e3e6ee}}
#node-panel h2{font-size:20px;margin:0 32px 2px 0}
#node-panel .np-path{font:12px ui-monospace,Consolas,monospace;opacity:.65;word-break:break-all}
#node-panel .np-own{display:inline-block;font-size:11px;padding:0 8px;border:1px solid currentColor;border-radius:99px;opacity:.8;margin-top:6px}
#node-panel h3{font-size:12px;letter-spacing:.07em;text-transform:uppercase;opacity:.65;margin:18px 0 6px}
#node-panel p{margin:4px 0}
#node-panel ol,#node-panel ul{margin:2px 0 2px 18px;padding:0}
#node-panel li{margin:3px 0}
#node-panel code{font:12.5px ui-monospace,Consolas,monospace;background:rgba(127,127,127,.18);padding:0 4px;border-radius:4px}
#node-panel .np-edge{border:1px solid rgba(127,127,127,.3);border-radius:10px;padding:8px 12px;margin:8px 0;background:rgba(127,127,127,.06)}
#node-panel .np-edge b.dir{font-size:12px;opacity:.7}
#node-panel .np-edge a{color:#2563eb;cursor:pointer;font-weight:600;text-decoration:none}
#node-panel .np-why{border-left:3px solid #2563eb;background:rgba(37,99,235,.09);padding:6px 10px;border-radius:0 8px 8px 0;margin-top:8px}
#node-panel .np-close{position:absolute;top:14px;right:14px;border:0;background:transparent;color:inherit;font-size:22px;cursor:pointer;line-height:1}
#node-panel .np-hint{opacity:.6;font-size:12px;margin-top:18px}
#np-tip{position:fixed;left:16px;bottom:16px;z-index:9999;font:13px system-ui,sans-serif;background:#2563eb;color:#fff;padding:6px 12px;border-radius:8px;box-shadow:0 2px 8px #0003}
</style>
<div id="np-tip"></div>
<div id="node-panel" role="dialog" aria-live="polite"><button class="np-close" aria-label="Close">×</button><div id="np-body"></div></div>
<script>
(function(){
var N = {
user:{file:"(outside the app)",own:"",
 en:{what:"The person using the app. They drop JPG/PNG files or a ZIP onto the window, or click “Choose files”.",how:["Drags files from the file manager onto the window (drag-and-drop).","Or clicks “Choose files”, which opens a FileChooser.","Then changes settings, presses Back/Next, and clicks Export All."]},
 th:{what:"คนที่ใช้แอป ลากไฟล์ JPG/PNG หรือ ZIP มาวางบนหน้าต่าง หรือกดปุ่ม “Choose files”",how:["ลากไฟล์จากโฟลเดอร์มาวางบนหน้าต่าง (drag-and-drop)","หรือกด “Choose files” ซึ่งจะเปิด FileChooser","จากนั้นเปลี่ยน settings, กด Back/Next แล้วกด Export All"]}},
app:{file:"src/main/java/se233/vectorize/VectorizeApplication.java (+ Launcher.java)",own:"Mona",
 en:{what:"The starting point. It creates every main object once and connects them through their constructors.",how:["Launcher.main() calls Application.launch(VectorizeApplication.class). It's a separate plain class, so the packaged JAR starts without a JavaFX module error.","start(stage) creates the objects in order: ZipImportService → AutoTraceVectorEngine → VectorizationService(engine) → ProcessingCoordinator(vectorization) → VectorizeView(stage) → VectorizeController(view, coordinator, new ImageImportService(zip)).","stop() calls coordinator.close() (stops the threads) and zip.close() (deletes the temporary ZIP folders)."]},
 th:{what:"จุดเริ่มต้นของแอป สร้าง object หลักทุกตัวครั้งเดียวแล้วต่อเข้าด้วยกันผ่าน constructor",how:["Launcher.main() เรียก Application.launch(VectorizeApplication.class) แยกเป็นคลาสธรรมดา JAR ที่ build แล้วจะได้เปิดได้ไม่ติด error เรื่อง JavaFX module","start(stage) สร้าง object ตามลำดับ: ZipImportService → AutoTraceVectorEngine → VectorizationService(engine) → ProcessingCoordinator(vectorization) → VectorizeView(stage) → VectorizeController(view, coordinator, new ImageImportService(zip))","stop() เรียก coordinator.close() (หยุด thread) และ zip.close() (ลบโฟลเดอร์ ZIP ชั่วคราว)"]}},
view:{file:"src/main/java/se233/vectorize/view/VectorizeView.java",own:"Mona",
 en:{what:"Draws the UI and nothing else: a drop screen and an editor screen. The controls are public fields so the controller can listen to them.",how:["The constructor builds both screens, disables JavaScript in the WebView before any SVG goes in, then shows the drop screen.","onDrop(receiver): drag-over accepts files; drag-dropped converts them to List<Path> and passes them to the controller.","showOriginal(path): new Image(url, true) loads the image in the background.","showSvg(svg): WebView.loadContent(svg, \"image/svg+xml\"). clearSvg() shows “Preview pending…”.","setZoom / zoomToFit only change the display scale. They never re-trace the image."]},
 th:{what:"วาดหน้าจออย่างเดียว มีหน้า drop กับหน้า editor และ control ต่าง ๆ เป็น field แบบ public ให้ controller ผูก listener ได้",how:["constructor สร้างทั้งสองหน้า ปิด JavaScript ของ WebView ก่อนจะมี SVG เข้ามา แล้วโชว์หน้า drop","onDrop(receiver): ตอนลากผ่านจะรับไฟล์ พอปล่อยจะแปลงเป็น List<Path> ส่งให้ controller","showOriginal(path): new Image(url, true) โหลดรูปเบื้องหลัง","showSvg(svg): WebView.loadContent(svg, \"image/svg+xml\") ส่วน clearSvg() จะโชว์ “Preview pending…”","setZoom / zoomToFit เปลี่ยนแค่ขนาดที่แสดง ไม่ได้ trace รูปใหม่"]}},
controller:{file:"src/main/java/se233/vectorize/controller/VectorizeController.java",own:"Mona",
 en:{what:"The brain of the UI. It turns every click or drop into an action, but sends all heavy work to the coordinator.",how:["wire() attaches every handler: drop/choose → importPaths; zoom buttons; Back/Next; the 4 setting controls → changeSettings; Export All; Cancel; Save/Load preset.","importPaths → coordinator.importAsync(...). When it succeeds: session.addAll, view.showEditor, coordinator.preprocess.","changeSettings → builds a new VectorizationSettings, calls document.settings(new) (generation +1), then coordinator.refresh(doc).","showSelected() redraws the selected image: original, SVG (only if hasCurrentResult()), controls, palette swatches, “2 / 5 • name”, status and errors.","The updatingControls flag stops showSelected's own setValue calls from looking like a user change."]},
 th:{what:"สมองของ UI แปลงทุกการคลิกหรือลากวางเป็นการกระทำ แต่ส่งงานหนักทั้งหมดไปให้ coordinator",how:["wire() ผูก handler ทั้งหมด: drop/choose → importPaths, ปุ่ม zoom, Back/Next, control settings 4 ตัว → changeSettings, Export All, Cancel, Save/Load preset","importPaths → coordinator.importAsync(...) ถ้าสำเร็จ: session.addAll, view.showEditor, coordinator.preprocess","changeSettings → สร้าง VectorizationSettings ตัวใหม่ เรียก document.settings(ใหม่) (generation +1) แล้ว coordinator.refresh(doc)","showSelected() วาดรูปที่เลือกใหม่: รูปต้นฉบับ, SVG (เฉพาะตอน hasCurrentResult()), control ต่าง ๆ, สีที่เจอ, “2 / 5 • ชื่อไฟล์”, สถานะ, error","flag updatingControls กันไม่ให้ setValue ที่ showSelected เรียกเองถูกนับเป็นการเปลี่ยนของผู้ใช้"]}},
session:{file:"src/main/java/se233/vectorize/model/AppSession.java (+ ImageDocument, VectorizationSettings, enums)",own:"",
 en:{what:"In-memory state: the list of loaded ImageDocuments and which one is selected.",how:["addAll(docs), selected(), size(), canBack/canNext, back/next (they throw if you go past either end).","documents() returns List.copyOf, a read-only copy.","Each ImageDocument holds its own settings, status, svg, detected colors, error and a generation counter. That's why Back/Next restores each image's own settings.","VectorizationSettings is an immutable record (Medium/Custom/2/false by default; the color count must be 2–5)."]},
 th:{what:"state ในหน่วยความจำ: รายการ ImageDocument ที่โหลดแล้ว และรูปไหนที่ถูกเลือกอยู่",how:["addAll(docs), selected(), size(), canBack/canNext, back/next (เลื่อนเลยหัวหรือท้ายจะ throw)","documents() คืน List.copyOf เป็นสำเนาที่แก้ไม่ได้","ImageDocument แต่ละตัวเก็บ settings, status, svg, สีที่เจอ, error และตัวนับ generation ของตัวเอง กด Back/Next เลยได้ settings ของรูปนั้นกลับมา","VectorizationSettings เป็น record ที่แก้ไม่ได้ (default Medium/Custom/2/false, จำนวนสีต้องอยู่ระหว่าง 2–5)"]}},
presets:{file:"src/main/java/se233/vectorize/service/PresetService.java",own:"Mona",
 en:{what:"An extra feature: save and load the current settings as a .properties file.",how:["save(file, settings): writes 4 keys (detail, colorMode, customColors, removeBackground) to a temp file, then does an ATOMIC_MOVE over the target.","load(file): reads it and checks every field (a known enum value, a count of 2–5, true or false). Any problem becomes an IOException with a clear message.","It always runs off the FX thread, through coordinator.runBackground."]},
 th:{what:"ฟีเจอร์เสริม: เซฟ/โหลด settings ปัจจุบันเป็นไฟล์ .properties",how:["save(file, settings): เขียน 4 ค่า (detail, colorMode, customColors, removeBackground) ลงไฟล์ temp แล้ว ATOMIC_MOVE ไปทับไฟล์ปลายทาง","load(file): อ่านแล้วเช็กทุกช่อง (ต้องเป็น enum ที่มีจริง, จำนวนสี 2–5, true/false) ถ้ามีปัญหาจะกลายเป็น IOException พร้อมข้อความที่อ่านเข้าใจ","รันนอก FX thread เสมอ ผ่าน coordinator.runBackground"]}},
presetfile:{file:"(a file the user picks, *.properties)",own:"",
 en:{what:"The preset file on disk. It's a plain text Properties file that the user can open in any editor.",how:["Created by PresetService.save and read by PresetService.load."]},
 th:{what:"ไฟล์ preset บนเครื่อง เป็นไฟล์ Properties แบบ text ธรรมดา เปิดด้วยโปรแกรมแก้ไขข้อความอะไรก็ได้",how:["PresetService.save เป็นคนสร้าง และ PresetService.load เป็นคนอ่าน"]}},
coordinator:{file:"src/main/java/se233/vectorize/concurrency/ProcessingCoordinator.java",own:"Day",
 en:{what:"The bridge between the UI thread and the worker threads. Every heavy job becomes a JavaFX Task here.",how:["It has two executors: workers (a fixed pool of 2–4 daemon threads) for jobs that may overlap, and serial (a single thread) for jobs that must run one at a time.","importAsync / runBackground wrap any Callable in a Task; setOnSucceeded / setOnFailed deliver the result or error message back on the FX thread.","preprocess / refresh → schedulePreview: cancel the old preview Task, snapshot the path, settings and generation on FX, run vectorization.convert on a worker, and store the result only if the generation still matches.","exportAll: an ExportItem snapshot per image → a Task that calls export.exportOne. A Batch counts ok / failed / cancelled jobs for the progress text.","cancelActive() calls task.cancel(true) on everything in the active list. close() also shuts down both pools."]},
 th:{what:"สะพานระหว่าง UI thread กับ worker thread งานหนักทุกงานจะกลายเป็น JavaFX Task ที่นี่",how:["มี executor 2 ตัว: workers (pool คงที่ 2–4 daemon thread) สำหรับงานที่รันซ้อนได้ และ serial (thread เดียว) สำหรับงานที่ต้องรันทีละงาน","importAsync / runBackground ห่อ Callable อะไรก็ได้ไว้ใน Task ส่วน setOnSucceeded / setOnFailed ส่งผลหรือข้อความ error กลับมาบน FX thread","preprocess / refresh → schedulePreview: ยกเลิก Task พรีวิวตัวเก่า, snapshot path, settings, generation บน FX, รัน vectorization.convert บน worker แล้วเก็บผลเฉพาะตอนที่ generation ยังตรง","exportAll: snapshot เป็น ExportItem ทีละรูป → Task ที่เรียก export.exportOne และ Batch นับ ok / พัง / ยกเลิก ไว้แสดงความคืบหน้า","cancelActive() เรียก task.cancel(true) กับทุกตัวใน list active ส่วน close() ปิดทั้งสอง pool ด้วย"]}},
policy:{file:"src/main/java/se233/vectorize/concurrency/ProcessingPolicy.java",own:"Day",
 en:{what:"The assignment's parallel rule, kept in one place.",how:["isParallelCandidate(count, s) = count > 1 AND detail == MEDIUM AND colorMode == CUSTOM AND customColors == 2.","hasParallelPair(list) = at least 2 images qualify, because overlapping needs at least two jobs.","It's a pure function with no threads, so ProcessingPolicyTest can test it directly."]},
 th:{what:"กฎรันขนานตามโจทย์ เก็บไว้ที่เดียว",how:["isParallelCandidate(count, s) = count > 1 และ detail == MEDIUM และ colorMode == CUSTOM และ customColors == 2","hasParallelPair(list) = มีอย่างน้อย 2 รูปที่เข้าเงื่อนไข (เพราะรันซ้อนต้องมีอย่างน้อยสองงาน)","เป็น pure function ไม่มี thread เลย ProcessingPolicyTest เทสต์ได้ตรง ๆ"]}},
importer:{file:"src/main/java/se233/vectorize/service/ImageImportService.java",own:"Day",
 en:{what:"Turns the dropped paths into ImageDocuments, keeping the good files even when some are bad.",how:["importPaths(list) handles each path: .zip → zip.extract(path), then validate each extracted image; .jpg/.jpeg/.png → validateImage; anything else → “unsupported file type”.","Each path has its own try/catch, so errors are collected per file and the others still import.","validateImage decodes the file for real with ImageIO.read (a renamed fake file gives null, so it's rejected) and rejects anything larger than 10000px.","Returns ImportResult(documents, errors)."]},
 th:{what:"แปลง path ที่ลากมาเป็น ImageDocument โดยเก็บไฟล์ที่ดีไว้แม้จะมีบางไฟล์เสีย",how:["importPaths(list) ไล่ทีละ path: .zip → zip.extract(path) แล้วเช็กทุกรูปที่แตกออกมา, .jpg/.jpeg/.png → validateImage, อย่างอื่น → “unsupported file type”","แต่ละ path มี try/catch ของตัวเอง error เลยเก็บแยกเป็นรายไฟล์ ไฟล์อื่นยัง import ได้","validateImage decode ไฟล์จริงด้วย ImageIO.read (ไฟล์ปลอมที่เปลี่ยนชื่อมาจะได้ null เลยโดนปฏิเสธ) และไม่รับรูปที่ใหญ่เกิน 10000px","คืนค่าเป็น ImportResult(documents, errors)"]}},
zip:{file:"src/main/java/se233/vectorize/service/ZipImportService.java",own:"Day",
 en:{what:"Safely unzips the images into a temporary folder that the app owns.",how:["Creates a temporary directory and walks the entries, skipping folders and non-image files.","Zip Slip check: rejects an entry that starts with “/” or “C:”, or that resolves outside the temp folder (for example ../../x.png).","Copies each image out as index_name.png, so duplicate names can't clash.","On error it deletes the partial files. An empty ZIP gives “No supported images found”.","close() deletes every temporary folder it created (called when the app stops)."]},
 th:{what:"แตกไฟล์รูปจาก ZIP อย่างปลอดภัยลงโฟลเดอร์ชั่วคราวของแอป",how:["สร้างโฟลเดอร์ชั่วคราว แล้วไล่ดูทีละ entry ข้ามโฟลเดอร์และไฟล์ที่ไม่ใช่รูป","เช็ก Zip Slip: ไม่รับ entry ที่ขึ้นต้นด้วย “/” หรือ “C:” หรือ path หลุดออกนอกโฟลเดอร์ temp (เช่น ../../x.png)","คัดลอกรูปออกมาเป็น index_name.png ชื่อซ้ำจะได้ไม่ชนกัน","ถ้ามี error จะลบไฟล์ที่แตกไปบางส่วนทิ้ง ส่วน ZIP ว่างจะได้ “No supported images found”","close() ลบโฟลเดอร์ชั่วคราวทั้งหมดที่สร้างไว้ (เรียกตอนปิดแอป)"]}},
vectorization:{file:"src/main/java/se233/vectorize/service/VectorizationService.java",own:"Day",
 en:{what:"Runs the whole pipeline: one image path in, a validated SVG out.",how:["convert(source, settings, cancelled, stage): check cancel → ImageIO.read the image, plus sourceVersion (file size + last-modified time).","preprocessor.prepare(image, settings) → a PreparedRaster (image, ignoredColor, detectedColors).","Writes it to a temporary PNG → engine.trace(png, settings, ignoredColor, cancelled).","validator.validate(svg) → returns ConversionResult(svg, colors, sourceVersion, PIPELINE_VERSION).","finally: deletes the temporary PNG. stage.accept(...) reports honest step names (“Tracing vectors”)."]},
 th:{what:"คุม pipeline ทั้งหมด: ใส่ path ของรูปหนึ่งรูป ได้ SVG ที่ตรวจแล้วออกมา",how:["convert(source, settings, cancelled, stage): เช็ก cancel → ImageIO.read รูป + sourceVersion (ขนาดไฟล์ + เวลาแก้ไขล่าสุด)","preprocessor.prepare(image, settings) → ได้ PreparedRaster (image, ignoredColor, detectedColors)","เขียนลง PNG ชั่วคราว → engine.trace(png, settings, ignoredColor, cancelled)","validator.validate(svg) → คืน ConversionResult(svg, สี, sourceVersion, PIPELINE_VERSION)","finally: ลบ PNG ชั่วคราว ส่วน stage.accept(...) บอกชื่อขั้นตอนตามจริง (“Tracing vectors”)"]}},
preprocessor:{file:"src/main/java/se233/vectorize/service/RasterPreprocessor.java",own:"Day",
 en:{what:"Prepares the pixels so autotrace gets a clean image: the right size, a limited set of colors, and a background it can skip.",how:["Scales the image so its longest side is at most detail.maxDimension() (Low 360, Medium 640, High 960 px), using bilinear smoothing.","background.mask(...) runs first, so reducing colors can't merge the shape into the background.","colors.analyze(...) → in Custom mode only, palette(n) is built and every pixel is snapped to its nearest palette color.","Masked pixels are painted a color no foreground pixel uses (magenta-ish), and that color is returned as ignoredColor (RRGGBB)."]},
 th:{what:"เตรียมพิกเซลให้ autotrace ได้รูปที่สะอาด: ขนาดพอดี, จำนวนสีจำกัด, และพื้นหลังที่ข้ามได้",how:["ย่อรูปให้ด้านที่ยาวที่สุดไม่เกิน detail.maxDimension() (Low 360, Medium 640, High 960 px) แบบ bilinear","background.mask(...) ทำก่อน การลดสีเลยไม่ทำให้รูปทรงไปรวมกับพื้นหลัง","colors.analyze(...) → เฉพาะโหมด Custom จะสร้าง palette(n) แล้วเปลี่ยนทุกพิกเซลเป็นสีใน palette ที่ใกล้ที่สุด","พิกเซลที่ถูก mask จะทาด้วยสีที่ไม่มี foreground ใช้ (โทนม่วงชมพู) แล้วส่งสีนั้นออกไปเป็น ignoredColor (RRGGBB)"]}},
background:{file:"src/main/java/se233/vectorize/service/BackgroundRemovalService.java",own:"Day",
 en:{what:"Decides which pixels are background. It returns a boolean[] where true means “not foreground”.",how:["Fully transparent PNG pixels (alpha 0) are always masked.","If Remove Background is on: groups the border pixels into rough color buckets and picks the most common one.","If that color covers less than 60% of the border, it gives up (it's probably a photo).","Otherwise it runs a BFS flood fill from the border through similar pixels (±24 per RGB channel). Only regions connected to the edge are removed, so white details inside a logo stay."]},
 th:{what:"ตัดสินว่าพิกเซลไหนเป็นพื้นหลัง คืนค่าเป็น boolean[] โดย true = “ไม่ใช่ foreground”",how:["พิกเซล PNG ที่โปร่งใสทั้งหมด (alpha 0) จะถูก mask เสมอ","ถ้าเปิด Remove Background: จัดกลุ่มสีของพิกเซลที่ขอบรูปแบบคร่าว ๆ แล้วเลือกกลุ่มที่เจอบ่อยที่สุด","ถ้าสีนั้นมีไม่ถึง 60% ของขอบ จะไม่ลบ (น่าจะเป็นรูปถ่าย)","ไม่งั้นทำ flood fill แบบ BFS จากขอบ ลามไปยังพิกเซลที่สีใกล้กัน (±24 ต่อช่อง RGB) ลบเฉพาะส่วนที่ต่อกับขอบ จุดสีขาวที่อยู่ในโลโก้เลยยังอยู่"]}},
colors:{file:"src/main/java/se233/vectorize/service/ColorAnalysisService.java",own:"Day",
 en:{what:"Finds the main colors (shown as swatches in the UI) and builds the 2–5 color palette for Custom mode.",how:["analyze(image, excluded): samples up to about 250k pixels, skipping masked ones, and rounds each into a 16-step color bin.","Sorts the bins by count, with ties broken by RGB so the result is repeatable.","detectedColors = the bins that hold at least 1% of the pixels, up to 10 (this ignores JPEG noise).","palette(n) = Median Cut: split the heaviest box along its widest RGB channel at the weighted median until there are n boxes; each box becomes its weighted average color."]},
 th:{what:"หาสีหลัก (โชว์เป็นช่องสีใน UI) และสร้าง palette 2–5 สีสำหรับโหมด Custom",how:["analyze(image, excluded): สุ่มพิกเซลได้ถึงประมาณ 250k จุด ข้ามพิกเซลที่ถูก mask แล้วปัดแต่ละพิกเซลลงกลุ่มสีทีละ 16 ระดับ","เรียงกลุ่มตามจำนวน ถ้าเท่ากันเรียงด้วย RGB ผลเลยออกมาเหมือนเดิมทุกครั้ง","detectedColors = กลุ่มที่มีพิกเซลอย่างน้อย 1% (สูงสุด 10 สี) ซึ่งตัด noise ของ JPEG ทิ้ง","palette(n) = Median Cut: แบ่งกล่องที่หนักที่สุดตามช่อง RGB ที่กว้างที่สุด ตรงค่ากลางถ่วงน้ำหนัก จนได้ n กล่อง แต่ละกล่องกลายเป็นสีเฉลี่ยถ่วงน้ำหนักของกล่องนั้น"]}},
engine:{file:"src/main/java/se233/vectorize/adapter/AutoTraceVectorEngine.java (implements VectorEngine.java)",own:"Day",
 en:{what:"The adapter that runs the external autotrace program and returns its SVG text.",how:["VectorEngine is a one-method interface: trace(png, settings, ignoredColor, cancelled) → String. This class is the real implementation.","Builds the command as a list of arguments (never one shell string): -output-format svg -error-threshold <curveError> [-background-color RRGGBB] -output-file out.svg in.png.","ProcessBuilder: stdout is discarded and stderr goes to a log file, so a full pipe can't freeze the process.","Waits in 100 ms steps: if cancelled → CANCELLED; after 60 s → ENGINE timeout.","A non-zero exit code, an empty SVG, or an SVG with no <path> → ENGINE error. finally: destroyForcibly() and delete the temporary files.","Finds the program from -Dvectorize.autotrace, then the Homebrew paths, then PATH."]},
 th:{what:"adapter ที่รันโปรแกรม autotrace ภายนอกแล้วคืนข้อความ SVG ออกมา",how:["VectorEngine เป็น interface ที่มี method เดียว: trace(png, settings, ignoredColor, cancelled) → String ส่วนคลาสนี้คือตัว implement จริง","สร้างคำสั่งเป็น list ของ argument (ไม่ใช่ string ของ shell ก้อนเดียว): -output-format svg -error-threshold <curveError> [-background-color RRGGBB] -output-file out.svg in.png","ProcessBuilder: stdout ทิ้งไป ส่วน stderr เขียนลงไฟล์ log ถ้า pipe เต็มโปรแกรมก็ไม่ค้าง","รอทีละ 100 ms: ถ้าโดนยกเลิก → CANCELLED, ถ้าเกิน 60 วินาที → ENGINE timeout","exit code ไม่ใช่ 0, SVG ว่าง หรือไม่มี <path> → error แบบ ENGINE ส่วน finally: destroyForcibly() แล้วลบไฟล์ชั่วคราว","หาโปรแกรมจาก -Dvectorize.autotrace → path ของ Homebrew → PATH"]}},
autotrace:{file:"(external program, not our code)",own:"",
 en:{what:"An open-source command-line tracer. It turns a bitmap into vector <path> outlines.",how:["It reads the prepared PNG and writes an SVG file.","-error-threshold controls how closely the curves follow the edges (Low 0.5, Medium 0.25, High 0.1).","-background-color tells it which color to skip, which is how we get a transparent background."]},
 th:{what:"โปรแกรม command-line แบบ open-source ที่แปลงรูป bitmap เป็นเส้นขอบ vector (<path>)",how:["อ่าน PNG ที่เตรียมไว้แล้วเขียนออกมาเป็นไฟล์ SVG","-error-threshold คุมว่าเส้นโค้งจะตามขอบละเอียดแค่ไหน (Low 0.5, Medium 0.25, High 0.1)","-background-color บอกว่าให้ข้ามสีไหน เราเลยได้พื้นหลังโปร่งใส"]}},
export:{file:"src/main/java/se233/vectorize/service/ExportService.java",own:"Day",
 en:{what:"Saves one image as one .svg file, safely. The coordinator handles the batch.",how:["Checks that the folder exists and is writable, otherwise it's an OUTPUT error.","Reuses the cached preview SVG only if its sourceVersion and PIPELINE_VERSION still match. Otherwise it calls vectorization.convert again.","Calls validator.validate(svg) once more before writing.","reserve() picks name.svg, name-1.svg, … inside synchronized(reserved), because several worker threads export at once.","Writes a temp file in the folder, then Files.move WITHOUT REPLACE_EXISTING, so it never overwrites. On failure the temp file is deleted."]},
 th:{what:"เซฟรูปหนึ่งรูปเป็นไฟล์ .svg หนึ่งไฟล์อย่างปลอดภัย ส่วนทั้งชุด coordinator เป็นคนจัดการ",how:["เช็กว่าโฟลเดอร์มีอยู่และเขียนได้ ไม่งั้นเป็น error แบบ OUTPUT","ใช้ SVG พรีวิวที่ cache ไว้เฉพาะตอนที่ sourceVersion และ PIPELINE_VERSION ยังตรงกัน ไม่งั้นเรียก vectorization.convert ใหม่","เรียก validator.validate(svg) อีกรอบก่อนเขียน","reserve() เลือกชื่อ name.svg, name-1.svg, … ภายใน synchronized(reserved) เพราะมีหลาย worker thread export พร้อมกัน","เขียนไฟล์ temp ในโฟลเดอร์ แล้ว Files.move แบบไม่ใส่ REPLACE_EXISTING เลยไม่เขียนทับ ถ้าพังก็ลบไฟล์ temp ทิ้ง"]}},
validator:{file:"src/main/java/se233/vectorize/service/SvgValidationService.java",own:"Day",
 en:{what:"A safety gate: it only lets real, safe vector SVG through. It's used for both preview and export.",how:["Empty SVG → error. It parses the XML with DOCTYPE disabled (which blocks XXE attacks); broken XML → error.","The root must be <svg> in the SVG namespace, with a width/height or a viewBox.","Rejects <image> (a hidden bitmap, so not a real vector), <script>, foreignObject, iframe, object and embed.","Rejects on* event attributes, external href links, and javascript: or data: URLs.","Needs at least one real shape (a path with a non-empty d, rect, circle and so on)."]},
 th:{what:"ด่านตรวจความปลอดภัย ปล่อยผ่านเฉพาะ SVG ที่เป็น vector จริงและปลอดภัย ใช้ทั้งตอนพรีวิวและ export",how:["SVG ว่าง → error, parse XML โดยปิด DOCTYPE ไว้ (กันการโจมตีแบบ XXE) ถ้า XML พัง → error","root ต้องเป็น <svg> ใน SVG namespace และมี width/height หรือ viewBox","ไม่รับ <image> (ซ่อน bitmap ไว้ = ไม่ใช่ vector จริง), <script>, foreignObject, iframe, object, embed","ไม่รับ attribute on*, href ที่ลิงก์ออกข้างนอก, และ URL แบบ javascript: หรือ data:","ต้องมี shape จริงอย่างน้อยหนึ่งอัน (path ที่ d ไม่ว่าง, rect, circle ฯลฯ)"]}},
outdir:{file:"(the folder chosen in DirectoryChooser)",own:"",
 en:{what:"Where the final .svg files go: one file per image.",how:["Existing files are never overwritten. A clash becomes name-1.svg, name-2.svg, and so on.","Leftover .vectorize-*.tmp files are cleaned up on failure."]},
 th:{what:"ที่เก็บไฟล์ .svg สุดท้าย รูปละหนึ่งไฟล์",how:["ไม่เขียนทับไฟล์ที่มีอยู่แล้ว ถ้าชื่อชนจะกลายเป็น name-1.svg, name-2.svg ไปเรื่อย ๆ","ถ้าพังกลางทาง ไฟล์ .vectorize-*.tmp ที่ค้างอยู่จะถูกลบ"]}}
};
var E = {

"controller-coordinator":{en:"importAsync (on drop), preprocess (after import), refresh (on a settings change), exportAll, cancelActive, runBackground (presets). Why: the controller runs on the FX thread, so anything slow must go through the coordinator or the window freezes.",th:"importAsync (ตอนลากวาง), preprocess (หลัง import), refresh (ตอนเปลี่ยน settings), exportAll, cancelActive, runBackground (preset) เหตุผล: controller รันบน FX thread งานไหนช้าต้องส่งผ่าน coordinator ไม่งั้นหน้าต่างค้าง"},

var panel=document.getElementById('node-panel'), body=document.getElementById('np-body'), tip=document.getElementById('np-tip');
  document.documentElement.appendChild(panel); document.documentElement.appendChild(tip);
function lang(){ return document.documentElement.lang==='th'?'th':'en'; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function codeify(s){ return esc(s).replace(/&lt;b&gt;|&lt;\/b&gt;/g,'').replace(/\b([A-Za-z_]+\.[A-Za-z_]+\([^)]*\)|[A-Za-z_]+\(\)|[A-Z][A-Za-z]+(?:Service|Engine|Raster|Result|Item|Exception|Settings|Document|Policy|Coordinator)\b)/g,'<code>$1</code>'); }
function nodeLabel(id){ var g=document.querySelector('[data-node-id="'+id+'"]'); return g?g.getAttribute('data-node-label'):id; }
var edges=[].slice.call(document.querySelectorAll('[data-edge-id]')).map(function(g){return {id:g.getAttribute('data-edge-id'),from:g.getAttribute('data-edge-from'),to:g.getAttribute('data-edge-to'),label:g.getAttribute('data-edge-label')||''};}).filter(function(e,i,a){return a.findIndex(function(x){return x.id===e.id;})===i;}).concat(extraEdges);
var current=null;
function render(id){
  var n=N[id]; if(!n) return; current=id; var L=lang(), t=n[L];
  var T = L==='th'?{what:'ทำอะไร',how:'ทำงานยังไง',in:'เส้นที่เข้ามา (ใครเรียกไฟล์นี้)',out:'เส้นที่ออกไป (ไฟล์นี้เรียกใคร)',none:'ไม่มี',hint:'คลิกชื่อกล่องในเส้นเชื่อมเพื่อกระโดดไปดูไฟล์นั้น · กด Esc เพื่อปิด',from:'จาก',to:'ไปที่'}
                 :{what:'What it does',how:'How it works',in:'Incoming (who uses this file)',out:'Outgoing (what this file calls)',none:'None',hint:'Click a box name in a connection to jump to it · press Esc to close',from:'from',to:'to'};
  var h='<h2>'+esc(nodeLabel(id))+'</h2><div class="np-path">'+esc(n.file)+'</div>'+(n.own?'<span class="np-own">'+n.own+'</span>':'');
  h+='<h3>'+T.what+'</h3><p>'+codeify(t.what)+'</p><h3>'+T.how+'</h3><ol>'+t.how.map(function(x){return '<li>'+codeify(x)+'</li>';}).join('')+'</ol>';
  function list(arr,dir){ if(!arr.length) return '<p style="opacity:.6">'+T.none+'</p>';
    return arr.map(function(e){ var other=dir==='in'?e.from:e.to; var ex=e.en?e:E[e.id]||{};
      return '<div class="np-edge"><b class="dir">'+(dir==='in'?T.from:T.to)+'</b> <a data-go="'+other+'">'+esc(nodeLabel(other))+'</a>'+(e.label?' · <code>'+esc(e.label)+'</code>':'')+(ex[L]?'<div class="np-why">'+codeify(ex[L])+'</div>':'')+'</div>'; }).join(''); }
  h+='<h3>'+T.in+'</h3>'+list(edges.filter(function(e){return e.to===id;}),'in');
  h+='<h3>'+T.out+'</h3>'+list(edges.filter(function(e){return e.from===id;}),'out');
  h+='<p class="np-hint">'+T.hint+'</p>';
  body.innerHTML=h; panel.classList.add('open'); panel.scrollTop=0;
}
function close(){ panel.classList.remove('open'); current=null; }
document.addEventListener('click',function(e){
  var go=e.target.closest&&e.target.closest('#node-panel [data-go]'); if(go){ render(go.getAttribute('data-go')); return; }
  if(e.target.closest&&e.target.closest('.np-close')){ close(); return; }
  var g=e.target.closest&&e.target.closest('svg [data-node-id]'); if(g){ render(g.getAttribute('data-node-id')); }
});
document.addEventListener('keydown',function(e){ var g=e.target.closest&&e.target.closest('svg [data-node-id]'); if(g&&(e.key==='Enter'||e.key===' ')) render(g.getAttribute('data-node-id')); if(e.key==='Escape') close(); });
function setTip(){ tip.textContent = lang()==='th' ? '👆 คลิกกล่องไหนก็ได้ เพื่อดูว่าไฟล์นั้นทำอะไรและเชื่อมกับใคร' : '👆 Click any box to see what that file does and how it connects'; }
new MutationObserver(function(){ setTip(); if(current) render(current); }).observe(document.documentElement,{attributes:true,attributeFilter:['lang']});
setTip(); setTimeout(function(){ tip.style.transition='opacity .6s'; tip.style.opacity='0'; setTimeout(function(){tip.style.display='none';},700); },9000);
})();
